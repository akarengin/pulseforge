spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

  jwt:
    # WARNING: This secret is for testing only. Do NOT use in production or commit to public repositories.
    secret: Ip4Ct7uegTZgBZLAucn8Dkf0BH0dHL/+L39v+msHXZs=
    expiration: 900000 # milliseconds